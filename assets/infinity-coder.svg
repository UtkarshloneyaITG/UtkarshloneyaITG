<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" font-family="'Segoe UI',Helvetica,Arial,sans-serif" aria-label="Infinity Coder: an AI coding agent for VS Code with plan mode, diff approval, semantic search and multi-provider failover" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="360" rx="16" fill="#111111"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#353535"/>
  <rect x="0" y="0" width="6" height="360" rx="3" fill="#ffffff"/>

  <g transform="translate(48 54)">
    <text font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#ffffff" letter-spacing="2">FLAGSHIP · AI CODING AGENT</text>
    <text y="54" font-size="42" font-weight="700" fill="#ffffff">Infinity Coder <tspan fill="#ffffff">∞</tspan></text>
    <text y="90" font-size="18" fill="#d0d0d0">An AI agent inside VS Code that reads, writes, searches</text>
    <text y="116" font-size="18" fill="#d0d0d0">and runs code, with any OpenAI-compatible model.</text>
    <g font-size="15" fill="#939393">
      <text y="158"><tspan fill="#ffffff">◆</tspan>  Plan mode and per-change diff approval</text>
      <text y="184"><tspan fill="#ffffff">◆</tspan>  Semantic code index (int8 vectors, no database)</text>
      <text y="210"><tspan fill="#ffffff">◆</tspan>  Key and model failover · @file mentions · Skills</text>
      <text y="236"><tspan fill="#ffffff">◆</tspan>  OS-keychain keys, SSRF guard, no telemetry</text>
    </g>
    <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12">
      <rect y="258" width="98" height="26" rx="13" fill="#282828" stroke="#6b6b6b"/><text x="49" y="275" text-anchor="middle" fill="#ffffff">TypeScript</text>
      <rect x="106" y="258" width="128" height="26" rx="13" fill="#282828" stroke="#6b6b6b"/><text x="170" y="275" text-anchor="middle" fill="#ffffff">VS Code API</text>
      <rect x="242" y="258" width="98" height="26" rx="13" fill="#282828" stroke="#6b6b6b"/><text x="291" y="275" text-anchor="middle" fill="#ffffff">Webview</text>
      <rect x="348" y="258" width="74" height="26" rx="13" fill="#282828" stroke="#6b6b6b"/><text x="385" y="275" text-anchor="middle" fill="#ffffff">RAG</text>
    </g>
  </g>

  <!-- agent sidebar mock -->
  <g transform="translate(700 36)" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
    <rect width="452" height="288" rx="12" fill="#000000" stroke="#353535"/>
    <path d="M0 12a12 12 0 0 1 12-12h428a12 12 0 0 1 12 12v22H0z" fill="#1a1a1a"/>
    <line x1="0" y1="34" x2="452" y2="34" stroke="#353535"/>
    <text x="16" y="22" font-size="11" fill="#ffffff" letter-spacing="1">∞ INFINITY CODER</text>
    <text x="436" y="22" text-anchor="end" font-size="11" fill="#939393">plan mode</text>

    <rect x="140" y="48" width="296" height="30" rx="8" fill="#292929"/>
    <text x="154" y="68" font-size="12.5" fill="#ffffff"><tspan fill="#ffffff">@auth.ts</tspan> add rate limiting</text>

    <text x="16" y="102" font-size="12" fill="#939393">plan</text>
    <text x="16" y="122" font-size="12.5" fill="#d0d0d0">1. read auth.ts + middleware/</text>
    <text x="16" y="142" font-size="12.5" fill="#d0d0d0">2. add limiter to POST /login</text>

    <rect x="16" y="156" width="420" height="78" rx="8" fill="#111111" stroke="#353535"/>
    <text x="28" y="176" font-size="11" fill="#939393">src/auth.ts</text>
    <rect x="17" y="184" width="418" height="20" fill="#252525"/>
    <text x="28" y="198" font-size="12" fill="#ffffff">- router.post("/login", login)</text>
    <rect x="17" y="206" width="418" height="20" fill="#272727"/>
    <text x="28" y="220" font-size="12" fill="#ffffff">+ router.post("/login", limit(5), login)</text>

    <rect x="16" y="246" width="96" height="28" rx="6" fill="#ffffff"/>
    <text x="64" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">Approve</text>
    <rect x="120" y="246" width="84" height="28" rx="6" fill="#252525" stroke="#353535"/>
    <text x="162" y="264" text-anchor="middle" font-size="12" fill="#d0d0d0">Reject</text>
  </g>
</svg>
