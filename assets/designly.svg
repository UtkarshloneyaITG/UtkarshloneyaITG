<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" font-family="'Segoe UI',Helvetica,Arial,sans-serif" aria-label="Designly: a free browser-based graphic design editor for social posts, stories and flyers">
  <defs>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.55" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="16" fill="#111111"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#353535"/>
  <rect x="0" y="0" width="6" height="360" rx="3" fill="#ffffff"/>

  <!-- editor mock (left this time) -->
  <g transform="translate(48 36)">
    <rect width="452" height="288" rx="12" fill="#000000" stroke="#353535"/>
    <path d="M0 12a12 12 0 0 1 12-12h428a12 12 0 0 1 12 12v22H0z" fill="#1a1a1a"/>
    <line x1="0" y1="34" x2="452" y2="34" stroke="#353535"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">DESIGNLY</text>
    <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#939393">
      <text x="120" y="22">Text</text><text x="160" y="22">Shapes</text><text x="212" y="22">Brush</text><text x="258" y="22">Image</text>
    </g>
    <rect x="378" y="9" width="62" height="18" rx="5" fill="#ffffff"/>
    <text x="409" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#000000">Export</text>

    <!-- tool rail -->
    <g fill="#353535">
      <rect x="14" y="52" width="26" height="26" rx="6" fill="#252525"/><rect x="21" y="59" width="12" height="12" rx="2" fill="#939393"/>
      <rect x="14" y="86" width="26" height="26" rx="6" fill="#2d2d2d"/><circle cx="27" cy="99" r="6" fill="#ffffff"/>
      <rect x="14" y="120" width="26" height="26" rx="6" fill="#252525"/><text x="27" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#939393">T</text>
      <rect x="14" y="154" width="26" height="26" rx="6" fill="#252525"/><path d="M27 160l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6-4.5-4 6-1z" fill="#939393"/>
    </g>

    <!-- artboard -->
    <rect x="58" y="50" width="200" height="222" rx="4" fill="url(#poster)"/>
    <circle cx="214" cy="96" r="30" fill="#ffffff" opacity="0.18"/>
    <path d="M78 250 l40 -46 l32 30 l26 -20 l62 36 z" fill="#000000" opacity="0.25"/>
    <text x="78" y="132" font-size="30" font-weight="800" fill="#ffffff">Spring</text>
    <text x="78" y="164" font-size="30" font-weight="800" fill="#ffffff">Drop</text>
    <text x="78" y="190" font-size="12" fill="#ffffff">New arrivals · Sat 10am</text>
    <rect x="57" y="114" width="122" height="84" fill="none" stroke="#ffffff" stroke-dasharray="4 3"/>
    <rect x="54" y="111" width="6" height="6" fill="#ffffff"/><rect x="176" y="111" width="6" height="6" fill="#ffffff"/><rect x="54" y="195" width="6" height="6" fill="#ffffff"/><rect x="176" y="195" width="6" height="6" fill="#ffffff"/>
    <line x1="158" y1="50" x2="158" y2="272" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- properties -->
    <g transform="translate(276 50)" font-size="11">
      <text fill="#939393" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="1">GRADIENT</text>
      <rect y="12" width="160" height="14" rx="7" fill="url(#poster)" stroke="#5a5a5a"/>
      <circle cx="7" cy="19" r="6" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><circle cx="88" cy="19" r="6" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><circle cx="153" cy="19" r="6" fill="#6b6b6b" stroke="#ffffff" stroke-width="2"/>
      <text y="54" fill="#939393" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="1">FONT</text>
      <rect y="62" width="160" height="26" rx="6" fill="#1a1a1a" stroke="#353535"/><text x="10" y="79" fill="#ffffff">Poppins · ExtraBold</text>
      <text y="112" fill="#939393" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="1">PRESET</text>
      <rect y="120" width="76" height="24" rx="6" fill="#2d2d2d" stroke="#6b6b6b"/><text x="38" y="136" text-anchor="middle" fill="#ffffff">IG Post</text>
      <rect x="84" y="120" width="76" height="24" rx="6" fill="#1a1a1a" stroke="#353535"/><text x="122" y="136" text-anchor="middle" fill="#d0d0d0">Story</text>
      <rect y="152" width="76" height="24" rx="6" fill="#1a1a1a" stroke="#353535"/><text x="38" y="168" text-anchor="middle" fill="#d0d0d0">A4</text>
      <rect x="84" y="152" width="76" height="24" rx="6" fill="#1a1a1a" stroke="#353535"/><text x="122" y="168" text-anchor="middle" fill="#d0d0d0">16:9</text>
      <text y="206" fill="#939393">PNG · JPG · SVG · PDF</text>
    </g>
  </g>

  <g transform="translate(556 54)">
    <text font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#ffffff" letter-spacing="2">LIVE · DESIGN EDITOR</text>
    <text y="54" font-size="42" font-weight="700" fill="#ffffff">Designly</text>
    <text y="90" font-size="18" fill="#d0d0d0">Design tools with actual taste. A free, in-browser editor</text>
    <text y="116" font-size="18" fill="#d0d0d0">for social posts, stories and flyers. No signup.</text>
    <g font-size="15" fill="#939393">
      <text y="158"><tspan fill="#ffffff">◆</tspan>  Google Fonts, shapes, icons, multi-stop gradients</text>
      <text y="184"><tspan fill="#ffffff">◆</tspan>  Neon and texture brushes, background removal, filters</text>
      <text y="210"><tspan fill="#ffffff">◆</tspan>  Smart guides, undo/redo, ready-made size presets</text>
      <text y="236"><tspan fill="#ffffff">◆</tspan>  Full-res export, designs stay on your device</text>
    </g>
    <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12">
      <rect y="258" width="78" height="26" rx="13" fill="#252525" stroke="#6b6b6b"/><text x="39" y="275" text-anchor="middle" fill="#ffffff">Next.js</text>
      <rect x="86" y="258" width="98" height="26" rx="13" fill="#252525" stroke="#6b6b6b"/><text x="135" y="275" text-anchor="middle" fill="#ffffff">TypeScript</text>
      <rect x="192" y="258" width="64" height="26" rx="13" fill="#252525" stroke="#6b6b6b"/><text x="224" y="275" text-anchor="middle" fill="#ffffff">React</text>
      <rect x="264" y="258" width="70" height="26" rx="13" fill="#252525" stroke="#6b6b6b"/><text x="299" y="275" text-anchor="middle" fill="#ffffff">Vercel</text>
    </g>
  </g>
</svg>
