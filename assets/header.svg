<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" font-family="'Segoe UI',Helvetica,Arial,sans-serif" aria-label="No Name — Full-stack developer building developer tools, AI workflows and web apps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .rise{animation:rise .9s ease-out both}
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
    @keyframes rise{from{opacity:0}to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#6b6b6b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6b6b6b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="380" rx="16" fill="#0d0d0d"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="15.5" fill="none" stroke="#252525"/>

  <!-- left: intro -->
  <g class="rise">
    <text x="64" y="92" class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="18" fill="#ffffff">~/noname <tspan fill="#939393">$</tspan> <tspan fill="#ffffff">whoami</tspan></text>
  </g>
  <g class="rise d1">
    <text x="62" y="170" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#ffffff">No Name</text>
    <rect x="356" y="122" width="6" height="54" fill="#ffffff" class="cursor"/>
  </g>
  <g class="rise d2">
    <text x="64" y="216" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#d0d0d0">Full-stack <tspan fill="#ffffff">&amp; dev-tools developer</tspan></text>
    <text x="64" y="252" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#939393">I build developer tools, AI-powered workflows</text>
    <text x="64" y="278" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#939393">and full-stack web apps.</text>
  </g>
  <g class="rise d3 mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13">
    <rect x="64" y="308" width="132" height="30" rx="15" fill="#2c2c2c" stroke="#6b6b6b"/>
    <circle cx="82" cy="323" r="4" fill="#ffffff" class="pulse"/>
    <text x="94" y="327.5" fill="#ffffff">shipping now</text>
    <rect x="206" y="308" width="176" height="30" rx="15" fill="#272727" stroke="#6b6b6b"/>
    <text x="222" y="327.5" fill="#ffffff">open to collab</text>
  </g>

  <!-- right: editor window -->
  <g transform="translate(640 56)" class="rise d2">
    <rect width="496" height="268" rx="12" fill="#111111" stroke="#353535"/>
    <path d="M0 12a12 12 0 0 1 12-12h472a12 12 0 0 1 12 12v24H0z" fill="#1a1a1a"/>
    <line x1="0" y1="36" x2="496" y2="36" stroke="#353535"/>
    <circle cx="20" cy="18" r="6" fill="#ffffff"/><circle cx="40" cy="18" r="6" fill="#ffffff"/><circle cx="60" cy="18" r="6" fill="#ffffff"/>
    <text x="248" y="23" text-anchor="middle" class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#939393">noname.ts</text>
    <g class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14.5">
      <text x="20" y="72"  fill="#4e4e4e">1</text><text x="48" y="72"><tspan fill="#ffffff">const</tspan><tspan fill="#ffffff"> noName</tspan><tspan fill="#ffffff"> = {</tspan></text>
      <text x="20" y="98"  fill="#4e4e4e">2</text><text x="68" y="98"><tspan fill="#ffffff">role</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ffffff">"Full-stack developer"</tspan><tspan fill="#ffffff">,</tspan></text>
      <text x="20" y="124" fill="#4e4e4e">3</text><text x="68" y="124"><tspan fill="#ffffff">building</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ffffff">"dev tools"</tspan><tspan fill="#ffffff">,</tspan></text>
      <text x="20" y="150" fill="#4e4e4e">4</text><text x="68" y="150"><tspan fill="#ffffff">stack</tspan><tspan fill="#ffffff">: [</tspan><tspan fill="#ffffff">"TS"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ffffff">"JS"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ffffff">"Python"</tspan><tspan fill="#ffffff">],</tspan></text>
      <text x="20" y="176" fill="#4e4e4e">5</text><text x="68" y="176"><tspan fill="#ffffff">into</tspan><tspan fill="#ffffff">: [</tspan><tspan fill="#ffffff">"dev tools"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ffffff">"AI"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ffffff">"APIs"</tspan><tspan fill="#ffffff">],</tspan></text>
      <text x="20" y="202" fill="#4e4e4e">6</text><text x="68" y="202"><tspan fill="#ffffff">ships</tspan><tspan fill="#ffffff">: () </tspan><tspan fill="#ffffff">=&gt;</tspan><tspan fill="#ffffff"> "tested, then deployed"</tspan></text>
      <text x="20" y="228" fill="#4e4e4e">7</text><text x="48" y="228" fill="#ffffff">};</text>
      <rect x="72" y="215" width="9" height="17" fill="#ffffff" class="cursor"/>
    </g>
  </g>
</svg>
