<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" font-family="'Segoe UI',Helvetica,Arial,sans-serif" aria-label="PromptPilot: a VS Code extension that fixes spelling, grammar and clarity in Claude Code prompts without touching code" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .swap{animation:swap 4s ease-in-out infinite}
    .swap2{animation:swap2 4s ease-in-out infinite}
    @keyframes swap{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
    @keyframes swap2{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="1200" height="330" rx="16" fill="#111111"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="15.5" fill="none" stroke="#353535"/>
  <rect x="0" y="0" width="6" height="330" rx="3" fill="#ffffff"/>

  <g transform="translate(48 52)">
    <text class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#ffffff" letter-spacing="2">FEATURED · VS CODE EXTENSION</text>
    <text y="52" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">PromptPilot</text>
    <text y="88" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#d0d0d0">Fixes spelling, grammar and clarity in your Claude Code</text>
    <text y="114" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#d0d0d0">prompts, and never touches your code, paths or commands.</text>
    <g class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#939393">
      <text y="156"><tspan fill="#ffffff">✓</tspan>  Quick Fix · Improve · Enhance modes</text>
      <text y="182"><tspan fill="#ffffff">✓</tspan>  Masks code, URLs and identifiers before sending</text>
      <text y="208"><tspan fill="#ffffff">✓</tspan>  Preview, diff and undo · NVIDIA, Anthropic, OpenAI-compatible</text>
    </g>
    <g class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12">
      <rect y="232" width="98" height="26" rx="13" fill="#272727" stroke="#6b6b6b"/><text x="49" y="249" text-anchor="middle" fill="#ffffff">TypeScript</text>
      <rect x="106" y="232" width="82" height="26" rx="13" fill="#272727" stroke="#6b6b6b"/><text x="147" y="249" text-anchor="middle" fill="#ffffff">VS Code</text>
      <rect x="196" y="232" width="148" height="26" rx="13" fill="#272727" stroke="#6b6b6b"/><text x="270" y="249" text-anchor="middle" fill="#ffffff">Claude Code hook</text>
      <rect x="352" y="232" width="64" height="26" rx="13" fill="#272727" stroke="#6b6b6b"/><text x="384" y="249" text-anchor="middle" fill="#ffffff">Vitest</text>
    </g>
  </g>

  <!-- before / after demo -->
  <g transform="translate(700 40)" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
    <rect width="452" height="250" rx="12" fill="#000000" stroke="#353535"/>
    <rect x="16" y="16" width="420" height="96" rx="8" fill="#121212"/>
    <text x="30" y="40" font-size="11" fill="#ffffff" letter-spacing="1">− YOUR PROMPT</text>
    <text x="30" y="66" font-size="14.5" fill="#ffffff">pls fix teh bug in <tspan fill="#ffffff">src/api/auth.ts</tspan></text>
    <text x="30" y="90" font-size="14.5" fill="#ffffff">wher login dont work when token expird</text>
    <rect x="16" y="122" width="420" height="96" rx="8" fill="#272727"/>
    <text x="30" y="146" font-size="11" fill="#ffffff" letter-spacing="1">+ WHAT CLAUDE SEES</text>
    <text x="30" y="172" font-size="14.5" fill="#ffffff">Please fix the bug in <tspan fill="#ffffff">src/api/auth.ts</tspan></text>
    <text x="30" y="196" font-size="14.5" fill="#ffffff">where login fails when the token expires.</text>
    <text x="30" y="238" font-size="11.5" fill="#939393">paths, code &amp; identifiers stay untouched</text>
  </g>
</svg>
