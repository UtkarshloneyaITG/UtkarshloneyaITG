<svg xmlns="http://www.w3.org/2000/svg" width="590" height="330" viewBox="0 0 590 330" role="img" font-family="'Segoe UI',Helvetica,Arial,sans-serif" aria-label="Status Page: a full-stack service status dashboard with a Python API and web frontend" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.3}}
  </style>
  <rect width="590" height="330" rx="16" fill="#111111"/>
  <rect x="0.5" y="0.5" width="589" height="329" rx="15.5" fill="none" stroke="#353535"/>
  <g transform="translate(36 48)">
    <text class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#ffffff" letter-spacing="2">FULL-STACK · LIVE ON VERCEL</text>
    <text y="44" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#ffffff">Status Page</text>
    <text y="76" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#939393">Service health at a glance: a Python API</text>
    <text y="98" class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#939393">with a web frontend, tested with pytest.</text>

    <rect y="122" width="518" height="92" rx="10" fill="#000000" stroke="#252525"/>
    <g class="sans" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">
      <circle cx="22" cy="146" r="5" fill="#ffffff" class="pulse"/><text x="36" y="151" fill="#d0d0d0">API</text><text x="496" y="151" text-anchor="end" fill="#ffffff" class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12">operational</text>
      <circle cx="22" cy="172" r="5" fill="#ffffff" class="pulse"/><text x="36" y="177" fill="#d0d0d0">Web</text><text x="496" y="177" text-anchor="end" fill="#ffffff" class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12">operational</text>
      <g transform="translate(20 192)">
        <rect width="10" height="12" rx="2" fill="#ffffff"/><rect x="14" width="10" height="12" rx="2" fill="#ffffff"/><rect x="28" width="10" height="12" rx="2" fill="#ffffff"/><rect x="42" width="10" height="12" rx="2" fill="#ffffff"/><rect x="56" width="10" height="12" rx="2" fill="#ffffff"/><rect x="70" width="10" height="12" rx="2" fill="#ffffff"/><rect x="84" width="10" height="12" rx="2" fill="#ffffff"/><rect x="98" width="10" height="12" rx="2" fill="#ffffff"/><rect x="112" width="10" height="12" rx="2" fill="#ffffff"/><rect x="126" width="10" height="12" rx="2" fill="#ffffff"/><rect x="140" width="10" height="12" rx="2" fill="#ffffff"/><rect x="154" width="10" height="12" rx="2" fill="#ffffff"/><rect x="168" width="10" height="12" rx="2" fill="#ffffff"/><rect x="182" width="10" height="12" rx="2" fill="#ffffff"/>
      </g>
    </g>
    <g class="mono" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12">
      <rect y="232" width="72" height="26" rx="13" fill="#2c2c2c" stroke="#6b6b6b"/><text x="36" y="249" text-anchor="middle" fill="#ffffff">Python</text>
      <rect x="80" y="232" width="66" height="26" rx="13" fill="#2c2c2c" stroke="#6b6b6b"/><text x="113" y="249" text-anchor="middle" fill="#ffffff">pytest</text>
      <rect x="154" y="232" width="70" height="26" rx="13" fill="#2c2c2c" stroke="#6b6b6b"/><text x="189" y="249" text-anchor="middle" fill="#ffffff">Render</text>
      <rect x="232" y="232" width="70" height="26" rx="13" fill="#2c2c2c" stroke="#6b6b6b"/><text x="267" y="249" text-anchor="middle" fill="#ffffff">Vercel</text>
    </g>
  </g>
</svg>
